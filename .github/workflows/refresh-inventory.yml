name: Refresh configured inventories

on:
  schedule:
    # Staggered checks tolerate delayed or omitted scheduled events. Durable
    # reservations ensure only the first eligible check uses provider calls.
    - cron: "17 9 * * *"
    - cron: "17 13 * * *"
    - cron: "17 17 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      vehicles:
        description: "Optional comma-separated vehicle slugs; blank checks all configured vehicles"
        required: false
        type: string
      retryFailed:
        description: "Retry selected vehicles that already failed today"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: configured-inventory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    outputs:
      refreshed: ${{ steps.refresh.outputs.refresh_succeeded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine Washington date
        id: date
        shell: pwsh
        run: |
          $utc = (Get-Date).ToUniversalTime()
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId(
            $utc,
            "Pacific Standard Time"
          ).ToString("yyyy-MM-dd")
          "value=$date" >> $env:GITHUB_OUTPUT

      - name: Synchronize main branch
        shell: pwsh
        run: git pull --ff-only origin main

      - name: Check API credential
        id: credential
        shell: pwsh
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:AUTO_DEV_API_KEY)
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Host "INVENTORY_API_KEY is not configured; no refresh was reserved."
          }

      - name: Reserve eligible vehicles
        id: reserve
        if: steps.credential.outputs.configured == 'true'
        shell: pwsh
        run: |
          $arguments = @(
            "scripts\refresh-published-inventory.py",
            "reserve-all",
            "--date",
            "${{ steps.date.outputs.value }}",
            "--vehicles",
            "${{ inputs.vehicles }}"
          )
          if ("${{ inputs.retryFailed }}" -eq "true") {
            $arguments += "--retry-failed"
          }
          python @arguments

      - name: Persist attempt reservations
        if: steps.reserve.outputs.should_refresh == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vehicles/*/refresh-state.json
          git commit -m "Reserve configured inventory refreshes for ${{ steps.date.outputs.value }}" `
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" `
            -m "Copilot-Session: 3ffe60bf-824c-4fb0-9555-7a41e8a02c0b"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Refresh eligible snapshots
        id: refresh
        if: steps.reserve.outputs.should_refresh == 'true'
        shell: pwsh
        env:
          AUTO_DEV_API_KEY: ${{ secrets.INVENTORY_API_KEY }}
        run: |
          python scripts\refresh-published-inventory.py refresh-all `
            --date "${{ steps.date.outputs.value }}" `
            --vehicles "${{ steps.reserve.outputs.reserved_vehicles }}"

      - name: Validate refreshed site
        if: steps.reserve.outputs.should_refresh == 'true'
        shell: pwsh
        run: |
          python -m unittest discover -s test -p "test*.py" -q
          python -m py_compile auto_dev\server.py scripts\export-auto-dev-snapshot.py scripts\refresh-published-inventory.py
          $publicFiles = @(
            "index.html",
            "styles.css",
            "site-v3.js",
            "inventory-v3.css",
            "lib\inventory.js",
            "lib\inventory-view-v2.js",
            "data\vehicles.json"
          )
          $publicFiles += Get-ChildItem "assets" -Recurse -File |
            Select-Object -ExpandProperty FullName
          $publicFiles += Get-ChildItem "vehicles" -Recurse -File |
            Where-Object { $_.Name -in @("inventory.json", "inventory-history.json") } |
            Select-Object -ExpandProperty FullName
          $hits = Select-String `
            -Path $publicFiles `
            -Pattern "auto[.-]?dev|/api/|AUTO_DEV_API_KEY|VehicleHistory/p/Report\.cfx"
          if ($hits) {
            $hits | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Commit refresh results
        if: steps.reserve.outputs.should_refresh == 'true'
        shell: pwsh
        run: |
          git add vehicles/*/inventory.json vehicles/*/inventory-history.json vehicles/*/refresh-state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The configured snapshots are already current."
            exit 0
          }
          git commit -m "Refresh configured inventories for ${{ steps.date.outputs.value }}" `
            -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>" `
            -m "Copilot-Session: 3ffe60bf-824c-4fb0-9555-7a41e8a02c0b"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail unsuccessful vehicle refreshes
        if: steps.refresh.outputs.refresh_failed == 'true'
        shell: pwsh
        run: throw "One or more vehicle refreshes failed; prior public snapshots were retained."

  deploy:
    needs: refresh
    if: always() && needs.refresh.outputs.refreshed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site/assets _site/data _site/lib _site/vehicles
          cp index.html styles.css inventory-v3.css site-v3.js .nojekyll _site/
          cp -R assets/. _site/assets/
          cp data/vehicles.json _site/data/
          cp lib/inventory.js lib/inventory-view-v2.js _site/lib/
          for inventory in vehicles/*/inventory.json; do
            vehicle_dir="$(dirname "$inventory")"
            slug="$(basename "$vehicle_dir")"
            mkdir -p "_site/vehicles/$slug"
            cp "$vehicle_dir/inventory.json" "$vehicle_dir/inventory-history.json" "_site/vehicles/$slug/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
