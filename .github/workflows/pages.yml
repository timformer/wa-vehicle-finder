name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "styles.css"
      - "inventory-v3.css"
      - "site-v3.js"
      - ".nojekyll"
      - "assets/**"
      - "data/vehicles.json"
      - "vehicles/*/inventory.json"
      - "vehicles/*/inventory-history.json"
      - "lib/inventory.js"
      - "lib/inventory-view-v2.js"
      - ".github/workflows/pages.yml"
      - ".github/workflows/refresh-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site/assets _site/data _site/lib _site/vehicles
          cp index.html styles.css inventory-v3.css site-v3.js .nojekyll _site/
          cp -R assets/. _site/assets/
          cp data/vehicles.json _site/data/
          cp lib/inventory.js lib/inventory-view-v2.js _site/lib/
          for inventory in vehicles/*/inventory.json; do
            vehicle_dir="$(dirname "$inventory")"
            slug="$(basename "$vehicle_dir")"
            mkdir -p "_site/vehicles/$slug"
            cp "$vehicle_dir/inventory.json" "$vehicle_dir/inventory-history.json" "_site/vehicles/$slug/"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for artifact indexing
        run: sleep 10
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
